version: 1

# Structured task fixtures consumed by tools/validate_routing.py.
#
# `cases` exercise routing/default-policy.yaml directly: each `task` must be
# valid against schemas/task.schema.json. `expected_matches` lists every
# route whose `match` expression evaluates true (order-independent);
# `expected_route` is the route selected after applying `precedence` (or
# `fallback_route` when `expected_matches` is empty).
#
# `override_cases` exercise the project-constraint selection algorithm
# described in prompts/orchestrate.md: route the base task, apply
# `project_routing.risk_overrides` (and every `path_floors` rule the task's
# `files_or_areas` match) as floors, route the constrained task,
# union the matches, add the base task's own selected route (`base_route`,
# which is `fallback_route` when nothing matched) as a selection candidate,
# and select the earliest route under global precedence. `base_route` is
# always included as a candidate so that an override which only newly
# matches a lower-precedence route than the base's fallback cannot downgrade
# routing below its unconstrained outcome.
#
# `invalid_project_routing_examples` are project-routing.yaml fragments that
# MUST fail validation against schemas/project-routing.schema.json, proving
# unknown/weakening keys fail closed rather than being silently accepted.

cases:

  - id: case-1-diagnosis-required
    task:
      id: case-1-diagnosis-required
      goal: Fix a subtle race condition causing persisted metadata edits to disappear.
      task_type: debugging
      failure_cost: high
      semantic_correctness: normal
      ambiguity: 5
      implementation_scope: small
      implementation_required: true
      cross_layer: false
      behavior_preservation: required
      diagnosis_required: true
      assumptions_must_be_explicit: true
      many_routine_decisions: false
      production_feature: false
      security_sensitive: false
      destructive_operation: false
      escalation_evidence:
        failure_cost: Lost metadata edits silently destroy persisted user data.
        behavior_preservation: Existing persisted behavior must remain unchanged except for the race.
        assumptions_must_be_explicit: The race's trigger conditions are unverified and must be stated before fixing.
      dependencies: []
      acceptance_criteria:
        - Race condition no longer causes lost metadata edits.
        - Regression test reproduces and verifies the fix.
      files_or_areas:
        - src/metadata/persistence
    expected_matches: [CODEX]
    expected_route: CODEX

