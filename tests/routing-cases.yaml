invalid_project_routing_examples:

  - id: invalid-unknown-top-level-key
    reason: routes is not a permitted project-routing key
    config:
      routes:
        CLAUDE: {}

  - id: invalid-precedence-override
    reason: precedence may not be overridden by a project
    config:
      precedence: [CLAUDE]

  - id: invalid-safety-boolean-false
    reason: safety booleans may only be forced to true, never weakened to false
    config:
      risk_overrides:
        security_sensitive: false

  - id: invalid-risk-override-unknown-field
    reason: task_type is not an overridable risk field
    config:
      risk_overrides:
        task_type: debugging

  - id: invalid-risk-override-bad-enum
    reason: extreme is not a valid failure_cost value
    config:
      risk_overrides:
        failure_cost: extreme

  - id: invalid-path-floor-boolean-false
    reason: a path floor may only force a safety boolean to true, never weaken it
    config:
      path_floors:
        - paths: ["src/auth/**"]
          floors: { security_sensitive: false }

  - id: invalid-path-floor-unknown-floor
    reason: task_type is not an overridable risk field, in path floors as in risk_overrides
    config:
      path_floors:
        - paths: ["migrations/**"]
          floors: { task_type: migration }

  - id: invalid-path-floor-unknown-rule-key
    reason: a path floor rule has exactly paths and floors
    config:
      path_floors:
        - paths: ["migrations/**"]
          floors: { failure_cost: high }
          route: CODEX

  - id: invalid-path-floor-empty-floors
    reason: a path floor rule must raise at least one field
    config:
      path_floors:
        - paths: ["migrations/**"]
          floors: {}

  - id: invalid-path-floor-negated-glob
    reason: a leading ! would read as a negation (a relaxing rule) and is rejected
    config:
      path_floors:
        - paths: ["!docs/**"]
          floors: { failure_cost: high }

  - id: invalid-path-floor-glob-double-star-in-segment
    reason: malformed glob, ** must be a whole path segment
    config:
      path_floors:
        - paths: ["src/**.py"]
          floors: { failure_cost: high }

  - id: invalid-path-floor-glob-character-class
    reason: malformed glob, character classes are not supported
    config:
      path_floors:
        - paths: ["[ab]/x"]
          floors: { failure_cost: high }

  - id: invalid-path-floor-glob-parent-segment
    reason: malformed glob, a glob may not leave the repository root
    config:
      path_floors:
        - paths: ["../outside/**"]
          floors: { failure_cost: high }
