version: 1

# Model-independent task-classification benchmark.
#
# The classifier predicts only gold_classification. task_facts are fixed
# outputs of decomposition and are not scored as classifier decisions.

cases:
  - id: classifier-001-debugging-race
    request: >
      Fix the race condition that intermittently causes persisted metadata edits
      to disappear, and add a regression test.
    repository_evidence:
      - The failure occurs in src/metadata/persistence.
      - The defect is intermittent and the root cause has not been established.
      - Existing persisted behavior must remain unchanged except for the bug.
    task_facts:
      id: classifier-001-debugging-race
      goal: Fix a subtle race condition causing persisted metadata edits to disappear.
      dependencies: []
      acceptance_criteria:
        - Race condition no longer causes lost metadata edits.
        - Regression test reproduces and verifies the fix.
      files_or_areas:
        - src/metadata/persistence
    gold_classification:
      task_type: debugging
      failure_cost: high
      semantic_correctness: normal
      ambiguity: 5
      implementation_scope: small
      implementation_required: true
      cross_layer: false
      behavior_preservation: required
      diagnosis_required: true
      assumptions_must_be_explicit: false
      many_routine_decisions: false
      production_feature: false
      security_sensitive: false
      destructive_operation: false
      escalation_evidence:
        failure_cost: Lost metadata edits silently destroy persisted user data.
        behavior_preservation: Existing persisted behavior must remain unchanged except for the bug.

