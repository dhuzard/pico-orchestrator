# Project-local execution authority policy for mission-level delivery.
# This is intentionally separate from .pi/routing.yaml:
# - routing.yaml decides which execution workflow/model family handles a task.
# - autonomy.yaml decides which repository/GitHub actions a mission controller may perform.
profile: guarded

# batch: the tasks of a wave are validated locally in their own worktrees,
# merged into one local pico/batch-<n> branch, and published with one push and
# one PR (when push_branch and create_pr allow it). task: one PR per task.
pr_granularity: batch

# refs: PR bodies reference their issue with `Refs #N`, which never closes it
# (the safe default when a PR may only partly address an issue). closes: PR
# bodies use `Closes #N`, so GitHub closes the issue when the PR merges.
issue_reference: refs

permissions:
  create_backlog_items: true
  create_github_issues: true
  create_worktrees: true
  commit: true
  push_branch: false
  create_pr: false
  comment_on_issue: true
  comment_on_pr: true
  mark_pr_ready: false

  merge:
    enabled: false
    max_failure_cost: medium
    require_ci: true
    require_review_if_policy_demands: true

  deploy: false

# Mutating Claude workers run their shell commands in Claude Code's OS sandbox
# by default: writes only in their bound worktree (and its git metadata), no
# reads of PICO's state directory or credential files such as ~/.config/gh, and
# no network. Only the user can opt out (PI_ORCHESTRATOR_WORKER_SANDBOX=0). A
# repository may widen it for its own checks, for example:
# worker_sandbox:
#   network:
#     allowed_domains: [registry.npmjs.org, pypi.org, files.pythonhosted.org]
#   cache_directories: [pip]   # under $XDG_CACHE_HOME, else ~/.cache

limits:
  parallel_tasks: 3     # most routed tasks per wave (declare_wave enforces it)
  open_prs: 2           # at the limit, new batches stack on the newest batch branch
  nested_agents_per_task: 4
  repair_attempts: 2
  replans: 3
