# Safe, constraints-only project-local routing overrides.
#
# Validated against schemas/project-routing.schema.json. This file may only
# add constraints on top of routing/default-policy.yaml: it can never define
# or replace routes, models, precedence, fallback, execution isolation,
# review categories, or completion requirements. Unknown keys are rejected.

project:
  name: ""
  domain: ""

critical_invariants: []

architecture_constraints: []

terminology: {}

validation:
  commands: []

# Floors, not replacements. Ordered fields raise the task's effective value
# to at least the given floor (never lower it). Safety booleans may only be
# set to `true` and are OR-merged with the task's own classification.
#
# Ordered fields (uncomment to set a floor):
#   failure_cost: low | medium | high
#   semantic_correctness: low | normal | critical
#   ambiguity: 0..10 (numeric floor)
#   implementation_scope: small | medium | broad
#   behavior_preservation: not_required | preferred | required
#
# Safety booleans (uncomment to force true; false is not a valid value here):
#   cross_layer: true
#   diagnosis_required: true
#   assumptions_must_be_explicit: true
#   production_feature: true
#   security_sensitive: true
#   destructive_operation: true
risk_overrides: {}

# Path-triggered floors. Each rule applies its `floors` (the same keys and
# raise-only values as risk_overrides) only to a task that touches one of its
# `paths`: before the run, when a glob matches one of the task's declared
# `files_or_areas`; after the run, when it matches a path the worker really
# changed in its bound worktree. A diff whose floors need a stronger route or
# capacity than the one that ran is not integrated: the run stops with
# CLASSIFICATION_UNDERRATED_BY_DIFF and resumes as a required re-route.
#
# Globs are repository-relative and anchored at the root: `*` and `?` match
# inside one path segment, a whole `**` segment matches zero or more segments
# (`migrations/**` covers `migrations/` and everything below it). Character
# classes, braces, backslashes, a leading `!` or `/`, and `.`/`..` segments are
# rejected. Matching is case-sensitive. A declared directory also touches the
# globs below it (`src` touches `src/db/migrations/**`). Built-in floors that
# no project can remove already make `.pi/**`, `.claude/**`, `.mcp.json` and
# `.github/workflows/**` security-sensitive. Example:
#
#   path_floors:
#     - paths: ["migrations/**", "schemas/**"]
#       floors: { failure_cost: high, behavior_preservation: required }
#     - paths: ["deploy/**", "**/*secret*"]
#       floors: { security_sensitive: true }
path_floors: []

# Free-text context for the orchestrating prompt only; no tool enforces it.
# Use path_floors for areas whose changes must raise routing.
protected_areas: []

notes: []
