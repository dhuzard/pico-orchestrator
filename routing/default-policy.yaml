review_findings:
  blocking:
    - BLOCKER
    - CORRECTNESS
    - REGRESSION

  repair_required:
    - TEST_GAP

  advisory:
    - ARCHITECTURAL_DEBT
    - STYLE_ONLY

fallbacks:
  - If uncertain between Claude and Codex, prefer Codex.
  - Broad plus consequential work is not a tie; use CODEX_CLAUDE_CODEX.
  - If Claude implementation fails twice, route to fresh Codex diagnosis.
  - If Codex cannot establish root cause, request independent Claude analysis.
  - Never silently downgrade a high-risk workflow.

completion:
  require:
    - acceptance criteria addressed
    - relevant invariants preserved
    - targeted validation executed when available
    - relevant regression tests executed when practical
    - no unresolved BLOCKER
    - no unresolved CORRECTNESS
    - no unresolved REGRESSION
    - no unresolved TEST_GAP
    - final diff inspected for unintended changes
