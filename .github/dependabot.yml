version: 2
# Monthly, one grouped PR per ecosystem, majors included, so updates arrive
# as at most three PRs a month. Security updates are a repository setting
# and still open as soon as an advisory is published.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # Types must match the runtime in package.json `engines` (Node 24).
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      pip:
        patterns: ["*"]

  # Keeps the SHA-pinned actions in .github/workflows current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
