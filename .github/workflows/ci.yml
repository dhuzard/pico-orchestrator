name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      # TypeScript tests invoke the Python routing boundary, so Python runtime
      # dependencies must exist before npm run check.
      - run: python -m pip install -r requirements-dev.txt pytest
      # Typecheck + import every extension: an unloadable extension fails here.
      - run: npm run check
      - run: python -m pytest -q

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Require no high-severity npm audit findings
        run: npm audit --audit-level=high

