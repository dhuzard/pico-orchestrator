name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: npm ci
      # TypeScript tests invoke the Python routing boundary, so Python runtime
      # dependencies must exist before npm run check.
      - run: python -m pip install -r requirements-dev.txt pytest
      # Typecheck + import every extension: an unloadable extension fails here.
      - run: npm run check
      # Policy/schema/prompt/README consistency gate documented in AGENTS.md.
      - run: python tools/validate_routing.py
      # Deterministic synthetic pilot (issue #49): the real scheduler, launcher, lease, recorder and gates
      # with scripted fake backends and a fake GitHub. No model, no network, no tokens. Its own step so a
      # regression in orchestration shows up under its own name; the full run below skips these two files
      # instead of running them twice. The real-agent benchmark (benchmarks/synthetic-workspace/run_real.py)
      # is started by hand, needs PICO_REAL_BENCHMARK=1, and is never run or enabled here.
      - run: python -m pytest -q tests/test_synthetic_pilot.py tests/test_real_benchmark_entry.py
      - run: python -m pytest -q --ignore=tests/test_synthetic_pilot.py --ignore=tests/test_real_benchmark_entry.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.17.1
      # Rule selection lives in pyproject.toml [tool.ruff].
      - run: ruff check --output-format=github .

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Require no high-severity npm audit findings
        run: npm audit --audit-level=high
